  - {id: iam, label: AWS IAM, level: generic, billed: [], quota: [iam], reads: ["Roles, policies, users and more against their limits"], not_seen: ["STS rate limits"]}
  - {id: waf, label: AWS WAF, level: generic, billed: ["AWS WAF"], quota: [wafv2], reads: [Quotas that publish usage], not_seen: ["Rule capacity per web ACL", "Blocked requests"]}
  - {id: ssm, label: AWS Systems Manager, level: generic, billed: ["AWS Systems Manager"], quota: [ssm], reads: [Quotas that publish usage], not_seen: ["Parameter Store throughput setting"]}
