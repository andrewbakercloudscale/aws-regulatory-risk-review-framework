    level: partial
    billed: ["Amazon Bedrock", "Amazon Bedrock AgentCore"]
    quota: [bedrock]
    rules: [bedrock_throttled]
    reads: [Throttled calls per model, Quotas that publish usage]
    not_seen: ["Tokens per minute against the model's quota, unless Service Quotas publishes it", "Latency", "Dependence on one region's capacity"]
  - id: acm
    label: AWS Certificate Manager
    checks: [certificates]
    level: partial
    billed: ["AWS Certificate Manager"]
    rules: [cert_expiry]
    reads: [Certificates in use that expire by the peak]
    not_seen: ["Certificates outside ACM, such as on instances or pods"]
  - id: route53
    label: Amazon Route 53
    level: generic
    billed: ["Amazon Route 53"]
    quota: [route53]
    reads: [Hosted zones against the limit, Quotas that publish usage]
    not_seen: ["Health checks and failover records", "Resolver endpoint limits"]
  - {id: kms, label: AWS KMS, level: generic, billed: ["AWS Key Management Service"], quota: [kms], reads: [Request rate quotas that publish usage], not_seen: ["Which callers drive the rate"]}
  - {id: secrets, label: AWS Secrets Manager, level: generic, billed: ["AWS Secrets Manager"], quota: [secretsmanager], reads: [Quotas that publish usage], not_seen: ["Callers with no caching"]}
  - {id: ecr, label: Amazon ECR, level: generic, billed: ["Amazon EC2 Container Registry (ECR)"], quota: [ecr], reads: [Quotas that publish usage], not_seen: ["Pull rate during a scale-out"]}
