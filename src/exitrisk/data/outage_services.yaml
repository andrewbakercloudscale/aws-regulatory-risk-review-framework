  - id: transit_gateway
    label: Transit Gateway
    checks: [vpc]
    level: partial
    billed: []
    rules: [tgw_drops]
    reads: [Packets dropped for a blackhole or no route]
    not_seen: ["Bandwidth per attachment"]
  - id: vpn
    label: Site-to-Site VPN
    checks: [vpc]
    level: partial
    billed: []
    rules: [vpn_tunnel_down]
    reads: [Tunnel state when read, Routing type]
    not_seen: ["Tunnel bandwidth"]
  - id: directconnect
    label: AWS Direct Connect
    checks: [network]
    level: partial
    billed: ["AWS Direct Connect"]
    rules: [dx_bandwidth]
    reads: [Bandwidth used against each connection's speed]
    not_seen: ["Whether a second connection can carry the first's traffic", "Connections owned by another account"]
  - id: cloudfront
    label: Amazon CloudFront
    checks: [cloudfront]
    level: partial
    billed: ["Amazon CloudFront"]
    quota: [cloudfront]
    rules: [cf_errors, cf_no_failover]
    reads: ["Requests and 5xx rate", Origins and origin groups]
    not_seen: ["Cache hit rate", "Origin capacity behind it"]
  - id: efs
    label: Amazon EFS
    checks: [files, storage]
    level: partial
    billed: ["Amazon Elastic File System"]
    quota: [elasticfilesystem]
    rules: [efs_burst, efs_io]
    reads: [Modes and size, Burst credits, I/O limit used]
    not_seen: ["Throughput against the elastic limit"]
  - id: fsx
    label: Amazon FSx
    checks: [files, storage]
    level: partial
    billed: ["Amazon FSx"]
    rules: [fsx_storage, fsx_single_az]
    reads: [Type deployment and capacity, Storage used and time to full]
    not_seen: ["Throughput and IOPS against what is provisioned"]
  - id: mq
    label: Amazon MQ
    checks: [mq]
    level: partial
    billed: ["Amazon MQ"]
    quota: [mq]
    rules: [mq_single, mq_cpu, mq_heap, mq_storage]
    reads: [Engine and deployment mode, "CPU, heap and store: peak and average", Alarm on store]
    not_seen: ["Queue depth and consumers", "Connection limits per instance size"]
  - id: sns
    label: Amazon SNS
    checks: [sns]
    level: partial
    billed: ["Amazon Simple Notification Service"]
    quota: [sns]
    rules: [sns_failed]
    reads: [Failed notifications per topic]
