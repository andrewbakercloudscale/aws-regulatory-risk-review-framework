  - {id: glue, label: AWS Glue, level: generic, billed: ["AWS Glue"], quota: [glue], reads: [Quotas that publish usage], not_seen: ["Job failures and concurrent runs"]}
  - {id: athena, label: Amazon Athena, level: generic, billed: ["Amazon Athena"], quota: [athena], reads: [Quotas that publish usage], not_seen: ["Queries queued"]}
  - {id: sagemaker, label: Amazon SageMaker, level: generic, billed: ["Amazon SageMaker"], quota: [sagemaker], reads: [Quotas that publish usage], not_seen: ["Endpoint use, scaling and errors"]}
  - {id: ses, label: Amazon SES, level: generic, billed: ["Amazon Simple Email Service"], quota: [ses], reads: [Quotas that publish usage], not_seen: ["Sending rate, bounce rate and account pause"]}
  - {id: emr, label: Amazon EMR, level: generic, billed: ["Amazon Elastic MapReduce"], quota: [elasticmapreduce], reads: [Quotas that publish usage], not_seen: ["Cluster health and capacity"]}
  - {id: batch, label: AWS Batch, level: generic, billed: ["AWS Batch"], quota: [batch], reads: [Quotas that publish usage], not_seen: ["Queued jobs"]}
  - {id: appsync, label: AWS AppSync, level: generic, billed: ["AWS AppSync"], quota: [appsync], reads: [Quotas that publish usage], not_seen: ["Throttled requests"]}
# Billed but with nothing that could fail at a peak on its own, so not counted as a gap in coverage.
not_runtime:
  - AWS Cost Explorer
  - Savings Plans for AWS Compute usage
  - Tax
  - AWS Support (Business)
  - AWS Support (Enterprise)
  - AWS Support (Developer)
  - AWS CloudTrail
  - AWS Config
  - AWS Security Hub
  - Amazon GuardDuty
  - AWS Identity and Access Management Access Analyzer
  - AWS Fault Injection Simulator
