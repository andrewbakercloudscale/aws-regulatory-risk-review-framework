    display: Pinpoint
    category: Business apps
    tier: 4
    why: Proprietary campaign, journey and segment definitions; sender IDs and registered numbers are tied to AWS. AWS ends support for Pinpoint's engagement features (campaigns, journeys, segments, analytics) on 30 October 2026; SMS, voice and push continue as AWS End User Messaging.
    migration: Move to Braze / Twilio / Azure Communication Services, or within AWS to Connect outbound campaigns; re-register sender IDs and short codes.
    targets: {azure: Azure Communication Services, gcp: Firebase Cloud Messaging + partner, other: Braze / Twilio}
    effort_weeks: 4
    agentic: medium
    duration: 1-3 months

