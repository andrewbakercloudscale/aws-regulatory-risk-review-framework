  # ---------------------------------------------------------------- AI / ML
  - service: Amazon SageMaker
    aliases: [Amazon SageMaker AI]
    display: SageMaker
    category: AI/ML
    tier: 3
    why: Models (PyTorch, XGBoost, Hugging Face) and containers are portable, but pipelines, feature store, endpoints and Studio domains are SageMaker-specific.
    migration: Move training/inference to Azure ML / Vertex AI or Kubeflow/MLflow; rebuild pipelines and feature store.
    targets: {azure: Azure Machine Learning, gcp: Vertex AI, other: Kubeflow / MLflow / KServe}
    effort_weeks: 5
    agentic: medium
    tooling: medium
    tools: {all: "MLflow tracks and moves models; containers and ONNX keep them portable", azure: "Azure Machine Learning", gcp: "Vertex AI"}
    duration: 1-3 months

  - service: Amazon Bedrock
    display: Bedrock
    category: AI/ML
    tier: 3
    why: Foundation models (Anthropic Claude, Llama, Mistral) are available on other clouds and direct from providers, but Bedrock Agents, Knowledge Bases, Guardrails and Flows are proprietary orchestration.
    migration: Call the same models via Vertex AI / Azure AI Foundry or the provider's own API; re-implement agents and RAG pipelines with a portable framework; re-run evaluations.
    targets: {azure: Azure AI Foundry, gcp: Vertex AI, other: Provider APIs (Anthropic, Mistral) / self-hosted}
    effort_weeks: 3
    agentic: medium
    tooling: high
    tools: {all: "A model gateway with an OpenAI-compatible API (LiteLLM, Portkey) switches providers; an evaluation harness (promptfoo) checks prompts on the new models", azure: "Azure AI Foundry (OpenAI and Anthropic models)", gcp: "Vertex AI (Gemini and Anthropic models)"}
    duration: 3-8 weeks

  - service: Amazon Bedrock AgentCore
    display: Bedrock AgentCore
    category: AI/ML
    tier: 4
    why: Agent runtime, memory, gateway, identity and observability services with AWS-specific APIs. Agent code written with open frameworks is portable; the hosting, memory stores and tool gateway are not.
    migration: Keep agent logic in an open framework (LangGraph, Strands, Claude Agent SDK); re-host on Azure AI Foundry Agent Service, Vertex AI Agent Engine or containers; migrate memory to a vector/relational store you control.
    targets: {azure: Azure AI Foundry Agent Service, gcp: Vertex AI Agent Engine, other: Containers + open agent frameworks}
    effort_weeks: 4
    agentic: medium
    duration: 1-2 months

