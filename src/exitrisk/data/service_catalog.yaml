# AWS exit-risk service catalog.
#
# Every AWS service that appears in Cost Explorer is mapped to an exit-risk tier:
#
#   1 Portable   - commodity infrastructure or an open standard; lift-and-shift.
#   2 Low        - managed flavour of an open engine/API; config and data move, code rarely does.
#   3 Moderate   - AWS-specific API, but a close equivalent exists everywhere; code changes needed.
#   4 High       - proprietary programming model or data model; redesign of the workload.
#   5 Critical   - no equivalent outside AWS; rebuild, re-platform or replace with a product.
#
# Fields
#   service       exact Cost Explorer SERVICE dimension value (matching is exact, then case-insensitive)
#   aliases       other names AWS has used for the same service in Cost Explorer
#   display       short name shown in charts
#   category      grouping used in the appendix
#   tier          1..5 as above
#   why           why it sits in that tier (shown in the report appendix)
#   migration     recommended migration path
#   targets       equivalent on the common destinations
#   effort_weeks  engineer-weeks to migrate ONE typical workload of this service in ONE account
#                 at ~US$1k/month spend; the estimate scales it by spend (see docs/METHODOLOGY.md)
#   duration      rough elapsed time for one workload, for the appendix
#   agentic       how much AI coding agents cut the engineering work when the Exit model says they are used:
#                 high (code and templates an agent can translate, about 50% less: Lambda, API Gateway,
#                 Step Functions, CloudFormation), medium (config and integration rewrites, about 25%),
#                 low (mostly rehosting or re-pointing, about 10%), none (data moves, hardware, contracts
#                 and managed-service redesign an agent cannot shorten)
#   tooling       how much migration tools cut the work when the Exit model says they are used, on the same
#                 scale as agentic: high (replication or import tools do the move: servers, databases, object
#                 storage, Kafka, DNS), medium (tools carry part of it), low, none (the default)
#   tools         migration tools worth naming: all (any target), azure, gcp, other (every other target)
#   excluded      true for billing lines that are not workloads (tax, support, commitments)
#
# Contributions welcome: see CONTRIBUTING.md. Keep `why` factual and `migration` actionable.

version: "2026.10.4"

tiers:
  1: {label: Portable, score: 10}
  2: {label: Low, score: 30}
  3: {label: Moderate, score: 50}
  4: {label: High, score: 75}
  5: {label: Critical, score: 95}

# Used for any service Cost Explorer reports that is not in this file.
unclassified:
  tier: 3
  why: Not yet classified in the catalog; scored as Moderate until reviewed.
  migration: Review the service and add it to service_catalog.yaml.
  effort_weeks: 4
  duration: Unknown

services:
  # ---------------------------------------------------------------- Compute
  - service: Amazon Elastic Compute Cloud - Compute
    aliases: [Amazon Elastic Compute Cloud, Amazon EC2]
    display: EC2
    category: Compute
    tier: 1
    why: Virtual machines running standard operating systems. Images can be exported or rebuilt from configuration management.
    migration: Rehost VMs (Azure Migrate, Google Migrate to VMs, or rebuild from Packer/Ansible images). Re-baseline instance sizes on the target.
    targets: {azure: Virtual Machines, gcp: Compute Engine, other: VMware / OpenStack / bare metal}
    effort_weeks: 1.5
    agentic: low
    tooling: high
    tools: {all: "Block-level server replication copies running machines and cuts over in minutes", azure: "Azure Migrate (server migration)", gcp: "Migrate to Virtual Machines", other: "virt-v2v, qemu-img or a rehost tool such as RiverMeadow"}
    duration: 1-4 weeks per application

  - service: EC2 - Other
    display: EC2 Other (EBS, NAT, transfer)
    category: Compute
    tier: 1
    why: Block storage, snapshots, NAT gateways, elastic IPs and data transfer. Commodity primitives on every cloud.
    migration: Recreate volumes and network egress on the target; move data with snapshots or block replication. Budget for one-off egress charges.
    targets: {azure: Managed Disks / NAT Gateway, gcp: Persistent Disk / Cloud NAT, other: SAN / Ceph}
    effort_weeks: 0.5
    agentic: low
    tooling: medium
    tools: {all: "Disks move with the servers' replication tool", azure: "Azure Migrate", gcp: "Migrate to Virtual Machines", other: "virt-v2v, qemu-img"}
    duration: Moves with the workload

  - service: Amazon Elastic Kubernetes Service
    aliases: [Amazon Elastic Container Service for Kubernetes, Amazon EKS]
    display: EKS
    category: Compute
    tier: 1
    why: Upstream Kubernetes. Manifests and Helm charts run on any conformant cluster; AWS-specific add-ons (IRSA, ALB controller, EBS CSI) are small and swappable.
    migration: Stand up AKS/GKE/on-prem Kubernetes, swap cloud add-ons (identity, ingress, storage classes), redeploy via GitOps.
    targets: {azure: AKS, gcp: GKE, other: OpenShift / Rancher / upstream Kubernetes}
    effort_weeks: 2
    agentic: medium
    tooling: high
    tools: {all: "Velero backs up and restores workloads and volumes; Helm and GitOps (Argo CD, Flux) redeploy the same manifests", azure: "AKS", gcp: "GKE", other: "Any conformant Kubernetes"}
    duration: 2-6 weeks per cluster

  - service: Amazon Elastic Container Service
    aliases: [Amazon EC2 Container Service, Amazon ECS]
    display: ECS
    category: Compute
    tier: 2
    why: Containers are portable but ECS task definitions, service discovery and deployment wiring are AWS-specific and must be rewritten.
    migration: Convert task definitions to Kubernetes manifests or Azure Container Apps / Cloud Run definitions. Images move unchanged.
    targets: {azure: Container Apps / AKS, gcp: Cloud Run / GKE, other: Kubernetes / Nomad}
    effort_weeks: 2.5
    agentic: high
    tooling: medium
    tools: {all: "Images run unchanged; AI agents convert task definitions to Kubernetes or Container Apps manifests", azure: "Azure Container Apps", gcp: "Cloud Run", other: "Kubernetes"}
    duration: 2-6 weeks per service group

  - service: Amazon EC2 Container Registry (ECR)
    aliases: [Amazon Elastic Container Registry, Amazon ECR]
    display: ECR
    category: Compute
    tier: 1
    why: OCI-compliant container registry; images copy directly.
    migration: Mirror repositories with skopeo/crane and repoint pipelines.
    targets: {azure: Azure Container Registry, gcp: Artifact Registry, other: Harbor}
    effort_weeks: 0.5
    agentic: low
    tooling: high
    tools: {all: "skopeo, crane or regctl copy every image and tag", azure: "az acr import", gcp: "gcrane"}
    duration: Days

  - service: AWS Lambda
    display: Lambda
    category: Compute
    tier: 4
    why: The function code is portable, but the event model, triggers (S3, SQS, DynamoDB streams, EventBridge), IAM wiring, layers and runtime limits are AWS-specific. Real Lambda estates are mostly glue between other AWS services.
    migration: Inventory triggers first. Repackage as containers on Cloud Run / Container Apps / Knative, or rewrite as Azure Functions; replace each event source with the target's equivalent. Migrate with the services it glues together, not alone.
    targets: {azure: Azure Functions / Container Apps, gcp: Cloud Run functions, other: Knative / OpenFaaS on Kubernetes}
    effort_weeks: 6
    agentic: high
    tooling: medium
    tools: {all: "AI coding agents translate handlers and AWS SDK calls; Serverless Framework or SST deploy to several clouds", azure: "Azure Functions Core Tools", gcp: "Cloud Run functions", other: "Knative or OpenFaaS"}
    duration: 4-12 weeks per application

  - service: AWS App Runner
    display: App Runner
    category: Compute
    tier: 2
    why: Runs a standard container image; only the service configuration is AWS-specific.
    migration: Deploy the same image to Cloud Run or Azure Container Apps.
    targets: {azure: Container Apps, gcp: Cloud Run, other: Kubernetes}
    effort_weeks: 1
    agentic: high
    tooling: medium
    tools: {all: "The container image moves unchanged", azure: "Azure Container Apps", gcp: "Cloud Run"}
    duration: 1-2 weeks

  - service: AWS Elastic Beanstalk
    display: Elastic Beanstalk
    category: Compute
    tier: 2
    why: Standard application runtimes on EC2; Beanstalk configuration (.ebextensions) must be rewritten.
    migration: Containerise or move to App Service / App Engine; translate environment configuration.
    targets: {azure: App Service, gcp: App Engine / Cloud Run, other: Kubernetes}
    effort_weeks: 2
    agentic: high
    tooling: medium
    tools: {all: "The application bundle moves; AI agents convert .ebextensions to the target's config", azure: "Azure App Service", gcp: "Cloud Run"}
    duration: 2-4 weeks

  - service: Amazon Lightsail
    display: Lightsail
    category: Compute
    tier: 1
    why: Simple VPS instances.
    migration: Rehost as small VMs.
    targets: {azure: Virtual Machines (B-series), gcp: Compute Engine (e2), other: Any VPS provider}
    effort_weeks: 0.5
    agentic: low
    duration: Days

  - service: AWS Batch
    display: Batch
    category: Compute
    tier: 2
    why: Container jobs on EC2/Fargate; job definitions and queues are AWS-specific.
    migration: Move to Azure Batch, Google Batch, or Kubernetes Jobs / Argo Workflows.
    targets: {azure: Azure Batch, gcp: Google Batch, other: Kubernetes Jobs / Slurm}
    effort_weeks: 2
    agentic: high
    tooling: medium
    tools: {all: "Container jobs move to Kubernetes Jobs or Argo Workflows", azure: "Azure Batch", gcp: "Google Cloud Batch"}
    duration: 2-4 weeks

  - service: AWS Outposts
    display: Outposts
    category: Compute
    tier: 3
    why: AWS-owned hardware in your data centre, operated through AWS APIs; contract terms and hardware return drive the timeline.
    migration: Replace with on-prem virtualisation or Azure Stack / Google Distributed Cloud; plan around contract end.
    targets: {azure: Azure Stack HCI, gcp: Google Distributed Cloud, other: VMware / OpenStack}
    effort_weeks: 8
    agentic: none
    duration: 3-6 months

  # ---------------------------------------------------------------- Storage
  - service: Amazon Simple Storage Service
    aliases: [Amazon S3]
    display: S3
    category: Storage
    tier: 2
    why: The S3 API is a de-facto standard implemented by most object stores, but bucket policies, event notifications, lifecycle rules, Object Lock and presigned URL patterns need translating, and large data sets incur egress cost and transfer time.
    migration: Copy with rclone / Storage Transfer Service / AzCopy; use S3-compatible endpoints where code depends on the S3 SDK; recreate lifecycle, retention and event rules.
    targets: {azure: Blob Storage, gcp: Cloud Storage, other: MinIO / Ceph RGW}
    effort_weeks: 1.5
    agentic: low
    tooling: high
    tools: {all: "rclone or MinIO Client (mc) copy and verify objects", azure: "AzCopy, Azure Storage Mover, Azure Data Box for bulk", gcp: "Storage Transfer Service, Transfer Appliance for bulk", other: "rclone, MinIO Client (mc)"}
    duration: 1-8 weeks (data-volume bound)

  - service: Amazon Glacier
    aliases: [Amazon S3 Glacier]
    display: Glacier
    category: Storage
    tier: 2
    why: Archive storage; retrieval is slow and paid, which dominates the timeline.
    migration: Plan bulk retrievals in waves; land in the target's archive tier.
    targets: {azure: Blob Archive tier, gcp: Archive Storage, other: Tape / object store}
    effort_weeks: 2
    agentic: none
    tooling: medium
    tools: {all: "Restore in bulk, then copy with the object-storage tools", azure: "AzCopy, Azure Data Box", gcp: "Storage Transfer Service"}
    duration: Weeks to months (retrieval bound)

  - service: Amazon Elastic File System
    display: EFS
    category: Storage
    tier: 1
    why: Standard NFS.
    migration: Sync to Azure Files (NFS) / Filestore with rsync or DataSync-equivalent tools.
    targets: {azure: Azure Files NFS / NetApp Files, gcp: Filestore, other: NFS appliance}
    effort_weeks: 1
    agentic: none
    tooling: medium
    tools: {all: "rsync or fpsync for NFS shares", azure: "Azure Storage Mover", gcp: "Storage Transfer Service"}
    duration: 1-3 weeks

  - service: Amazon FSx
    display: FSx
    category: Storage
    tier: 1
    why: Managed Windows File Server, Lustre, ONTAP or OpenZFS - all standard file systems.
    migration: Replicate to the equivalent managed file system (ONTAP SnapMirror where applicable).
    targets: {azure: Azure Files / NetApp Files, gcp: Filestore / NetApp Volumes, other: NetApp / Windows File Server}
    effort_weeks: 1.5
    agentic: none
    tooling: medium
    tools: {all: "robocopy (Windows shares), rsync (Lustre, ONTAP, OpenZFS); NetApp SnapMirror for ONTAP", azure: "Azure File Sync, Azure Storage Mover", gcp: "Storage Transfer Service"}
    duration: 2-4 weeks

  - service: AWS Backup
    display: Backup
    category: Storage
    tier: 2
    why: Backup policies and vaults are AWS-specific; the protected data moves with each workload. Retained backups must be kept (or restored and re-protected) to meet retention obligations.
    migration: Recreate policies in Azure Backup / Backup and DR; keep the AWS vault read-only until retention expires.
    targets: {azure: Azure Backup, gcp: Backup and DR, other: Veeam / Commvault}
    effort_weeks: 1
    agentic: low
    duration: Retention-bound tail

  - service: AWS Storage Gateway
    display: Storage Gateway
    category: Storage
    tier: 2
    why: Hybrid file/volume/tape gateway; standard protocols on-prem, AWS storage behind it.
    migration: Replace with Azure File Sync / NetApp or a vendor gateway.
    targets: {azure: Azure File Sync, gcp: NetApp / partner gateway, other: NAS}
    effort_weeks: 2
    agentic: low
    duration: 2-6 weeks

  - service: AWS Transfer Family
    display: Transfer Family
    category: Storage
    tier: 2
    why: Managed SFTP/FTPS in front of S3/EFS; protocol is standard, identity integration is not.
    migration: Move partner endpoints to Azure Blob SFTP or a managed SFTP; coordinate partner DNS/key changes early.
    targets: {azure: Blob Storage SFTP, gcp: Partner SFTP on GCS, other: OpenSSH / MOVEit}
    effort_weeks: 1.5
    agentic: medium
    duration: 2-6 weeks (partner coordination)

  - service: AWS DataSync
    display: DataSync
    category: Storage
    tier: 1
    why: A transfer tool; nothing runs on it long-term.
    migration: Retire; use the target's transfer tooling.
    targets: {azure: AzCopy / Data Box, gcp: Storage Transfer Service, other: rsync / rclone}
    effort_weeks: 0.25
    agentic: none
    duration: Days

  # ---------------------------------------------------------------- Databases
  - service: Amazon Relational Database Service
    aliases: [Amazon RDS, Amazon Aurora, Amazon RDS Optimize CPU License Included Third Party Fees]
    display: RDS / Aurora
    category: Database
    tier: 2
    why: PostgreSQL, MySQL, MariaDB, SQL Server and Oracle engines, plus Aurora (PostgreSQL/MySQL compatible). Schemas and SQL move; Aurora-only features (Global Database, Babelfish, Aurora Serverless scaling, IAM DB auth) and Oracle/SQL Server licensing need attention.
    migration: Migrate with native replication or DMS-equivalents (Azure DMS, Database Migration Service) into Azure Database / Cloud SQL / AlloyDB. Cut over per database with a short read-only window.
    targets: {azure: Azure Database for PostgreSQL/MySQL / Azure SQL, gcp: Cloud SQL / AlloyDB, other: Self-managed PostgreSQL (CloudNativePG)}
    effort_weeks: 3
    agentic: low
    tooling: high
    tools: {all: "Native replication (PostgreSQL logical replication, MySQL binlog replication, Oracle Data Guard or GoldenGate, SQL Server Always On) for a short cutover", azure: "Azure Database Migration Service", gcp: "Database Migration Service", other: "pgloader, pglogical, Debezium change data capture"}
    duration: 2-8 weeks per database

  - service: Amazon Aurora DSQL
    display: Aurora DSQL
    category: Database
    tier: 4
    why: Distributed, PostgreSQL-flavoured service with its own consistency model and a reduced feature set; applications are written around its behaviour.
    migration: Re-target to CockroachDB, YugabyteDB, Spanner (PostgreSQL interface) or AlloyDB; regression-test transactional behaviour.
    targets: {azure: Cosmos DB for PostgreSQL / CockroachDB, gcp: Spanner (PostgreSQL interface), other: CockroachDB / YugabyteDB}
    effort_weeks: 8
    agentic: medium
    duration: 2-4 months

  - service: Amazon DynamoDB
    display: DynamoDB
    category: Database
    tier: 5
    why: Proprietary key-value/document model. Single-table designs, GSIs, conditional writes, TTL and DynamoDB Streams are baked into application code and data layout. No wire-compatible equivalent outside AWS.
    migration: Redesign the data access layer. Common targets are Cosmos DB, Firestore/Bigtable, ScyllaDB (Alternator offers a DynamoDB-compatible API) or PostgreSQL JSONB. Replace Streams consumers. Run dual-writes during cutover.
    targets: {azure: Cosmos DB, gcp: Firestore / Bigtable / Spanner, other: ScyllaDB Alternator / Cassandra / PostgreSQL}
    effort_weeks: 10
    agentic: low
    tooling: medium
    tools: {all: "Export to S3 plus DynamoDB Streams for the changes since, then a bulk load", azure: "Data Factory or the Cosmos DB Spark connector into Cosmos DB", gcp: "Dataflow into Bigtable or Firestore", other: "ScyllaDB Alternator (DynamoDB-compatible API) and its Spark migrator"}
    duration: 2-6 months per application

  - service: Amazon DocumentDB (with MongoDB compatibility)
    aliases: [Amazon DocumentDB]
    display: DocumentDB
    category: Database
    tier: 2
    why: Speaks the MongoDB wire protocol (with gaps in operators and features). Apps written to the MongoDB driver usually move with minor fixes.
    migration: Migrate to MongoDB Atlas (on any cloud) or Cosmos DB for MongoDB with mongodump/mongorestore or live sync.
    targets: {azure: Cosmos DB for MongoDB, gcp: MongoDB Atlas, other: MongoDB}
    effort_weeks: 3
    agentic: low
    tooling: high
    tools: {all: "mongodump and mongorestore, or mongosync for a live copy", azure: "Azure Database Migration Service for Cosmos DB for MongoDB", gcp: "MongoDB Atlas Live Migration", other: "MongoDB Atlas Live Migration"}
    duration: 3-8 weeks

  - service: Amazon ElastiCache
    display: ElastiCache
    category: Database
    tier: 1
    why: Managed Redis / Valkey / Memcached - open engines.
    migration: Provision the target cache and warm it; caches rarely need data migration.
    targets: {azure: Azure Cache for Redis, gcp: Memorystore, other: Redis / Valkey}
    effort_weeks: 0.5
    agentic: low
    tooling: medium
    tools: {all: "RIOT or redis-shake copy keys live; most caches can simply be warmed again", azure: "Azure Cache for Redis RDB import", gcp: "Memorystore"}
    duration: Days

  - service: Amazon MemoryDB
    aliases: [Amazon MemoryDB for Redis]
    display: MemoryDB
    category: Database
    tier: 2
    why: Durable Redis-compatible store; data is the system of record, so it must be migrated, not rebuilt.
    migration: Replicate to Redis Enterprise / Azure Managed Redis; validate durability semantics.
    targets: {azure: Azure Managed Redis, gcp: Memorystore for Redis Cluster, other: Redis Enterprise}
    effort_weeks: 2
    agentic: low
    tooling: medium
    tools: {all: "RIOT or redis-shake copy keys live", azure: "Azure Cache for Redis RDB import", gcp: "Memorystore"}
    duration: 2-4 weeks

  - service: Amazon Keyspaces (for Apache Cassandra)
    aliases: [Amazon Keyspaces]
    display: Keyspaces
    category: Database
    tier: 2
    why: Cassandra CQL API with some unsupported features.
    migration: Move to Cassandra / ScyllaDB / Cosmos DB for Cassandra with dsbulk or dual-writes.
    targets: {azure: Cosmos DB for Apache Cassandra / Managed Instance for Cassandra, gcp: Bigtable (CQL) / Astra DB, other: Apache Cassandra / ScyllaDB}
    effort_weeks: 3
    agentic: low
    tooling: medium
    tools: {all: "DSBulk or the Spark Cassandra Connector", azure: "Cosmos DB for Apache Cassandra", other: "Apache Cassandra, ScyllaDB"}
    duration: 3-8 weeks

  - service: Amazon Neptune
    display: Neptune
    category: Database
    tier: 3
    why: Graph database using open query languages (Gremlin, openCypher, SPARQL), but loaders, IAM auth and Neptune-specific extensions need rework.
    migration: Move to Neo4j, Cosmos DB for Gremlin or JanusGraph; re-validate query behaviour.
    targets: {azure: Cosmos DB for Apache Gremlin, gcp: Neo4j AuraDB / Spanner Graph, other: Neo4j / JanusGraph}
    effort_weeks: 5
    agentic: low
    tooling: low
    tools: {all: "neptune-export to Gremlin or RDF files, then a bulk load"}
    duration: 1-3 months

  - service: Amazon Timestream
    display: Timestream
    category: Database
    tier: 4
    why: Proprietary time-series engine and SQL dialect (Timestream for InfluxDB is the portable variant).
    migration: Move to InfluxDB, TimescaleDB, Azure Data Explorer or Bigtable; rewrite queries and ingestion.
    targets: {azure: Azure Data Explorer, gcp: Bigtable / BigQuery, other: InfluxDB / TimescaleDB}
    effort_weeks: 6
    agentic: medium
    duration: 1-3 months

  - service: Amazon Quantum Ledger Database
    aliases: [Amazon QLDB]
    display: QLDB
    category: Database
    tier: 5
    why: Proprietary ledger database (PartiQL, cryptographic journal) with no equivalent; AWS ended support for QLDB on 31 July 2025, so any remaining use is urgent.
    migration: Re-implement on PostgreSQL with an append-only journal and hash chaining, or a ledger product such as Azure SQL ledger tables.
    targets: {azure: Azure SQL Database ledger, gcp: Spanner with audit tables, other: PostgreSQL + immudb}
    effort_weeks: 10
    agentic: none
    duration: 2-4 months

  - service: AWS Database Migration Service
    display: DMS
    category: Database
    tier: 1
    why: A migration tool, not a workload.
    migration: Retire; use the target's migration service.
    targets: {azure: Azure Database Migration Service, gcp: Database Migration Service, other: Debezium}
    effort_weeks: 0.25
    agentic: none
    duration: Days

  # ---------------------------------------------------------------- Analytics
  - service: Amazon Redshift
    display: Redshift
    category: Analytics
    tier: 4
    why: PostgreSQL-derived but proprietary MPP warehouse - distribution/sort keys, Spectrum external tables, stored procedures, UNLOAD/COPY from S3, Redshift ML and data sharing are all specific. Downstream BI and ELT jobs depend on its dialect.
    migration: Choose a warehouse (Snowflake or Databricks are cloud-neutral; BigQuery / Fabric Warehouse are native). Convert DDL and SQL with a translation tool, re-point ELT (dbt makes this far cheaper), reconcile results in parallel for several reporting cycles.
    targets: {azure: Fabric Warehouse / Synapse / Snowflake, gcp: BigQuery, other: Snowflake / Databricks / ClickHouse}
    effort_weeks: 10
    agentic: low
    tooling: high
    tools: {all: "SQL translators (BigQuery Migration Service, SnowConvert, sqlglot) and AI agents for stored procedures; data unloads to Parquet", azure: "Fabric Data Warehouse or Databricks SQL", gcp: "BigQuery Data Transfer Service for Redshift", other: "sqlglot, dbt"}
    duration: 3-9 months per warehouse

  - service: Amazon Athena
    display: Athena
    category: Analytics
    tier: 3
    why: Trino/Presto-based SQL, so queries are largely portable, but it is bound to the Glue Data Catalog, S3 locations and Athena workgroups.
    migration: Move tables to Iceberg/Delta, query with Trino, BigQuery or Databricks SQL.
    targets: {azure: Fabric / Synapse serverless SQL, gcp: BigQuery, other: Trino / Starburst}
    effort_weeks: 3
    agentic: high
    tooling: medium
    tools: {all: "Trino runs the same SQL; sqlglot translates it for other engines"}
    duration: 3-8 weeks

  - service: AWS Glue
    display: Glue
    category: Analytics
    tier: 4
    why: Spark under the hood, but jobs use GlueContext/DynamicFrame APIs, the Glue Data Catalog, crawlers and Glue workflows. The catalog is usually shared by Athena, EMR, Redshift Spectrum and Lake Formation, so it is a hub.
    migration: Port jobs to plain Spark (Databricks, Dataproc, Synapse Spark), migrate the catalog to Unity / Hive Metastore / Dataplex, and replace crawlers with explicit schemas.
    targets: {azure: Data Factory + Databricks, gcp: Dataproc / Dataflow + Dataplex, other: Spark + Airflow + Hive Metastore}
    effort_weeks: 6
    agentic: high
    tooling: medium
    tools: {all: "AI coding agents port GlueContext and DynamicFrame code to plain Spark; export the Data Catalog to a Hive Metastore", azure: "Databricks or Fabric Spark, Data Factory", gcp: "Dataproc, Dataplex", other: "Apache Spark and Airflow"}
    duration: 1-4 months

  - service: Amazon Elastic MapReduce
    aliases: [Amazon EMR]
    display: EMR
    category: Analytics
    tier: 2
    why: Open-source Spark, Hive, Presto, Flink. EMRFS, bootstrap actions and step orchestration need adjusting.
    migration: Run the same jobs on Databricks, Dataproc or HDInsight; swap s3:// paths and IAM roles.
    targets: {azure: Databricks / HDInsight, gcp: Dataproc, other: Spark on Kubernetes}
    effort_weeks: 3
    agentic: medium
    tooling: high
    tools: {all: "The same Spark and Hive jobs run unchanged; DistCp copies HDFS data", azure: "Databricks, HDInsight", gcp: "Dataproc"}
    duration: 1-2 months

  - service: Amazon Kinesis
    aliases: [Amazon Kinesis Data Streams]
    display: Kinesis Streams
    category: Analytics
    tier: 4
    why: Proprietary streaming API (shards, KCL checkpointing in DynamoDB, enhanced fan-out). Producers and consumers must be rewritten.
    migration: Move to Kafka (MSK-equivalent, Confluent, Event Hubs Kafka endpoint) or Pub/Sub; rewrite producers/consumers against the Kafka API to avoid the next lock-in.
    targets: {azure: Event Hubs (Kafka API), gcp: Pub/Sub / Managed Kafka, other: Apache Kafka / Redpanda}
    effort_weeks: 6
    agentic: medium
    tooling: medium
    tools: {all: "Kafka Connect Kinesis source connector or Flink to bridge streams during the move", azure: "Azure Event Hubs", gcp: "Pub/Sub"}
    duration: 1-3 months

  - service: Amazon Kinesis Firehose
    aliases: [Amazon Data Firehose]
    display: Firehose
    category: Analytics
    tier: 3
    why: Managed delivery pipeline with AWS-only sources and destinations.
    migration: Replace with Kafka Connect, Event Hubs Capture, or Dataflow templates.
    targets: {azure: Event Hubs Capture / Stream Analytics, gcp: Dataflow / Pub/Sub subscriptions, other: Kafka Connect / Vector}
    effort_weeks: 3
    agentic: medium
    tooling: medium
    tools: {all: "Kafka Connect sinks, Vector or Fluent Bit deliver the same streams"}
    duration: 3-6 weeks

  - service: Amazon Kinesis Analytics
    aliases: [Amazon Managed Service for Apache Flink]
    display: Managed Flink
    category: Analytics
    tier: 2
    why: Apache Flink applications are portable; legacy Kinesis SQL applications are not.
    migration: Run Flink jobs on Confluent, Ververica, or Flink on Kubernetes; rewrite any legacy SQL apps.
    targets: {azure: Flink on HDInsight on AKS / Stream Analytics, gcp: Dataflow / Flink on GKE, other: Apache Flink}
    effort_weeks: 3
