# AWS regions and how each catalog service behaves in a second region.
#
# Used by the multi-region estimate (src/exitrisk/multiregion.py, docs/MULTI_REGION.md).
#
# regions
#   name          AWS's name for the region
#   country       ISO 3166 country code: the data-residency test "same country"
#   jurisdiction  wider legal area for "same jurisdiction" (EU = the European Union / EEA)
#   continent     for "same continent"
#   lat, lon      approximate location, for the estimated round-trip latency between regions
#   via           where traffic to other continents actually routes (Cape Town reaches Asia and
#                 the Americas through Europe), so latency is not taken from the great circle
#   price         indicative price index against us-east-1 = 1.00, from EC2 on-demand list prices.
#                 Services vary around it; it moves the run cost of a second region, not the shape.
#
# Service availability per region is NOT here: it is data/region_services.json, refreshed from
# AWS's public regional services table with `python scripts/refresh_region_services.py`.
#
# services: catalog service name -> how it behaves in a second region
#   regional  the service's name in AWS's regional services table (null: not listed there, so
#             availability is "not verified"; global: one instance serves every region)
#   class     how its spend scales with the resilience pattern (see `classes`)

version: "2026.10.1"

