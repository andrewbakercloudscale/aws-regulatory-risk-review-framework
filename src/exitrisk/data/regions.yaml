# How each class behaves in a second region, for the two recovery targets:
#   [rto_3h, instant]   rto_3h = recover within 3 hours of a region-wide event (pilot light:
#                       data replicated continuously, a minimal footprint scaled up on failover);
#                       instant = on demand, no outage (active-active: both regions serve traffic).
#   run          second-region run cost as a share of the same spend in the primary region
#   build_weeks  engineer-weeks to make ONE typical workload (~US$1k/month) multi-region
#   failover     native = AWS replicates and fails over for you; manual = replication exists but
#                failover is a step someone runs; rebuild = no live replica, restore or re-run
#   note         the multi-region risk shown per account (services below may override it)
classes:
  compute:
    label: "Compute (VMs, containers)"
    run: [0.12, 1.00]
    build_weeks: [0.3, 1.0]
    failover: manual
    note: No cross-region failover built in. Images, launch templates and capacity must exist in the second region and be started by a runbook or automation.
  data:
    label: Databases
    run: [0.45, 1.00]
    build_weeks: [0.75, 2.5]
    failover: manual
    note: Needs a cross-region replica. Asynchronous replication loses the last seconds of writes, and promoting the replica is a decision someone has to make.
  storage:
    label: "Storage (S3, EBS snapshots, files)"
    run: [0.80, 1.00]
    build_weeks: [0.15, 0.4]
    failover: native
    note: Replication is available, but applications must be re-pointed to the copy and replication lag accepted.
  analytics:
    label: Analytics and data platform
    run: [0.25, 1.00]
    build_weeks: [0.75, 2.0]
    failover: rebuild
    note: Data platforms are built single-region. Datasets, catalogs and jobs must be copied and pipelines re-run; recovery takes hours.
  platform:
    label: "Network, security and monitoring"
    run: [0.40, 1.00]
    build_weeks: [0.1, 0.3]
    failover: manual
    note: Network, keys, secrets and security tooling are regional and must be built and kept in step in the second region.
  managed:
    label: "Serverless and integration (pay per use)"
    run: [0.05, 0.35]
    build_weeks: [0.2, 0.75]
    failover: manual
    note: Regional endpoints. Deploy to both regions and re-route traffic; in-flight messages and running executions do not fail over.
  business:
    label: "Business applications (Connect, WorkSpaces)"
    run: [0.15, 1.00]
    build_weeks: [0.75, 2.0]
    failover: manual
    note: Has its own failover model, often only for specific region pairs.
  ai:
    label: AI and ML
    run: [0.05, 0.50]
    build_weeks: [0.2, 0.75]
    failover: manual
    note: Models, endpoints and quotas differ by region and must be provisioned in the second region.
  tooling:
    label: "Delivery tooling (CI/CD)"
    run: [0.05, 0.20]
    build_weeks: [0.05, 0.1]
    failover: native
    note: Pipelines must deploy to both regions; the tooling itself can stay in one.
  global:
    label: "Global services (one copy serves every region)"
    run: [0, 0]
    build_weeks: [0, 0]
    failover: native
    note: Global service; nothing to fail over.

