# Service-specific multi-region risks: override the class failover and note.
risks:
  Amazon Elastic Compute Cloud - Compute: {failover: manual, note: "Manual failover: EC2 has no cross-region failover. Copy AMIs and EBS snapshots (or use Elastic Disaster Recovery) and start capacity in the second region; capacity there is not guaranteed without reservations."}
  EC2 - Other: {failover: manual, note: "EBS snapshots must be copied cross-region on a schedule; NAT gateways and endpoints are rebuilt per region."}
  Amazon Elastic Kubernetes Service: {failover: manual, note: "A second cluster per region (no cross-region control plane). Redeploy through GitOps; persistent volumes need their own replication."}
  Amazon Elastic Container Service: {failover: manual, note: "Clusters and services are regional: deploy to both regions and fail over with Route 53."}
  Amazon EC2 Container Registry (ECR): {failover: native, note: "Enable cross-region image replication so the second region can pull images when the first is down."}
  AWS Lambda: {failover: manual, note: "Functions are regional: deploy to both regions and route with Route 53 or API Gateway; event sources (queues, streams) do not move with them."}
  Amazon Relational Database Service: {failover: manual, note: "Cross-region read replica or Aurora Global Database. Promotion is a manual or scripted step (Aurora Global managed failover in about a minute); asynchronous, so a few seconds of writes can be lost."}
  Amazon Aurora DSQL: {failover: native, note: "Multi-Region clusters are active-active with strong consistency, in supported region sets only."}
  Amazon DynamoDB: {failover: native, note: "Global tables replicate both ways and both regions take writes; conflicting writes resolve last-writer-wins."}
  Amazon DocumentDB (with MongoDB compatibility): {failover: manual, note: "Global clusters replicate to the second region; failover promotes the secondary cluster."}
  Amazon ElastiCache: {failover: manual, note: "Global Datastore (Redis OSS / Valkey) replicates cross-region; without it the cache starts cold after failover."}
  Amazon MemoryDB: {failover: manual, note: "Multi-Region clusters only in some regions; otherwise snapshot copy and restore."}
  Amazon Neptune: {failover: manual, note: "Global Database for cross-region replicas; failover is a promotion step."}
  Amazon Simple Storage Service: {failover: native, note: "Cross-Region Replication (15-minute SLA with Replication Time Control). Applications must re-point, or use Multi-Region Access Points."}
  Amazon Elastic File System: {failover: native, note: "EFS replication to the second region (minutes of lag); fail over by mounting the replica."}
  Amazon FSx: {failover: manual, note: "Cross-region backup copy, or SnapMirror for FSx for NetApp ONTAP; restore or break the mirror to fail over."}
  AWS Backup: {failover: native, note: "Copy backups to a vault in the second region; restore time grows with data size."}
  Amazon Redshift: {failover: rebuild, note: "No live cross-region replica. Copy snapshots to the second region and restore (hours for a large warehouse), or load both regions from the pipelines."}
  AWS Glue: {failover: rebuild, note: "Jobs, crawlers and the Data Catalog are regional: replicate the catalog and re-run pipelines in the second region."}
  Amazon Athena: {failover: rebuild, note: "Queries need the data and Glue catalog to exist in the second region."}
  Amazon Elastic MapReduce: {failover: rebuild, note: "Clusters are rebuilt in the second region from code; data must be replicated to S3 there."}
  Amazon Kinesis: {failover: manual, note: "No native cross-region replication: producers dual-write or a consumer replicates; consumers restart at a new position."}
  Amazon Managed Streaming for Apache Kafka: {failover: manual, note: "MSK Replicator copies topics cross-region; consumers must handle offset translation on failover."}
  Amazon OpenSearch Service: {failover: manual, note: "Cross-cluster replication to a domain in the second region; re-point clients on failover."}
  Amazon Simple Queue Service: {failover: manual, note: "Queues are regional and messages are not replicated: in-flight messages are lost or delayed on failover."}
  Amazon Simple Notification Service: {failover: manual, note: "Topics and subscriptions are regional: recreate in the second region and publish there."}
  Amazon EventBridge: {failover: manual, note: "Global endpoints can fail event buses over between two regions; rules and targets must exist in both."}
  AWS Step Functions: {failover: manual, note: "State machines are regional; running executions do not fail over and must be restarted."}
  Amazon API Gateway: {failover: manual, note: "Deploy the API in both regions behind a custom domain with Route 53 failover."}
  Amazon Cognito: {failover: rebuild, note: "User pools are regional with no replication and password hashes cannot be exported: users must be migrated or re-registered, or a sync built."}
  AWS Key Management Service: {failover: manual, note: "Keys are regional. Data encrypted with single-Region keys cannot be decrypted in the second region: use multi-Region keys and re-encrypt."}
  AWS Secrets Manager: {failover: native, note: "Turn on secret replication to the second region."}
  AWS Direct Connect: {failover: manual, note: "Needs connections or a Direct Connect gateway association into the second region; physical lead times are weeks to months."}
  Amazon Virtual Private Cloud: {failover: manual, note: "VPCs, subnets, endpoints and inter-region peering or Transit Gateway must be built in the second region."}
  Amazon Elastic Load Balancing: {failover: manual, note: "Load balancers are regional; Route 53 health checks switch traffic between them."}
  Amazon Connect: {failover: manual, note: "Connect Global Resiliency replicates instances and numbers between specific region pairs and is enabled by AWS on request; otherwise a second instance with its own numbers."}
  Amazon WorkSpaces: {failover: manual, note: "Multi-Region Resilience gives standby WorkSpaces in a second region; directories and user data must exist there."}
  Amazon SageMaker: {failover: manual, note: "Models and endpoints must be redeployed in the second region; training data replicated."}
  Amazon Bedrock: {failover: native, note: "Cross-region inference spreads requests across regions, but model availability differs: check every model used exists in the second region."}
  Amazon Route 53: {failover: native, note: "Global, and the usual failover mechanism: health checks and failover records switch traffic."}
