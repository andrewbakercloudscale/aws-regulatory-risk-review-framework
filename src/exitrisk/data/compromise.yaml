# The Developer Compromise Report (report/compromise.py, collectors/compromise.py).
#
# The premise: developers' laptops and the pipelines are already compromised. So no money-moving flow may
# rest on trusting who changes it: each must be immutable (it cannot be changed, or every change can be
# undone and proven), or observable (every change is recorded and raises an alert). It runs only in the
# accounts the analyst picks, with strict rules.
#
# A path is reported only when AWS's policy simulator says it is allowed after identity policies, permission
# boundaries, organisation guardrails (SCPs) and the resource's own policy. Severity starts from the rule,
# then drops one level when CloudTrail records the action and two when an alert in the account fires on it,
# and one more when the path works only from certain addresses or VPC endpoints.
#
#   area      people, pipelines, assets, detection, exposure, changes
#   severity  the level before detection is weighed
version: "2026.11.2"
points: {critical: 40, high: 15, medium: 5, low: 1}

areas:
  people: {label: What a compromised laptop or pipeline can change, action: "Take standing write access to money-moving resources away from people: changes go through the pipeline, and a person gets access for one change, for an hour, approved by a second person."}
  credentials: {label: Credentials that stay on a laptop, action: "Remove IAM user access keys, shorten sign-in sessions, and require MFA on every human sign-in."}
  pipelines: {label: Pipelines and what they trust, action: "Tie each pipeline role to one repository and one protected branch, sign what the pipeline builds, and accept only signed artefacts."}
  exposure: {label: Open to the internet, action: "Put a sign-in in front of every API and function a payment depends on, or make it private."}
  detection: {label: Would anyone notice, action: "Log every write to payment data, alert on every change made by a person, and make sure no person can switch logging off."}
  changes: {label: Changes people made by hand, action: "Find out why each one was not made through the pipeline; treat a change from a laptop's command line as an incident until it is explained."}
  integrity: {label: Tamper evidence, action: "Keep every version of payment files, lock them for their retention period, and record database writes outside the database."}

rules:
  # ---- what a person can change (from the simulator; one finding per asset and action, naming who)
  - {id: person_payment_write, area: people, severity: critical, title: A payment resource can be changed with no alert, why: "These people and pipelines can make this change. Assume their laptops and runners are compromised: the Binance attacker used a stolen engineer's access and a deployment token against the money service. The change must then be impossible, or seen the moment it happens.", fix: "Make the resource immutable (Object Lock, code signing, immutable tags) where it can be; alert on every change to it; and take standing write access away from people, granting it for one change with approval."}
  - {id: person_write, area: people, severity: high, title: A production resource can be changed with no alert, why: "These people and pipelines can make this change, in a payment or channel account. If their credentials are compromised, nothing stops or flags it.", fix: "Alert on changes to it, and limit who can make them."}
  - {id: person_sign, area: people, severity: critical, title: A person can sign with a signing key, why: "A signature proves an authorised key signed something, not that the something was legitimate. Anyone who can call Sign can make the money service's signature on a transaction of their choosing.", fix: "Allow Sign only to the signing service's own role, deny it to every person with a key policy statement, and alert on any Sign from a person."}
  - {id: person_db, area: people, severity: critical, title: A person can get into a payment database, why: "Reading the admin password, resetting it, connecting with an AWS sign-in or running SQL through the Data API lets someone insert or change a row, and nothing at the AWS layer records the row.", fix: "Keep the admin password only for break-glass, rotate it after each use, and give people read-only database users through IAM authentication."}
  - {id: api_callable, area: exposure, severity: critical, title: A payment API can be called with a stolen credential, why: "The API checks only that the caller holds AWS credentials that allow it, and these people and pipelines do. From a compromised laptop, that is enough to call it directly, outside the application.", fix: "Restrict the API to the VPC endpoints and roles of the services that call it (aws:SourceVpce, aws:PrincipalArn in its resource policy), and log every call."}
  - {id: person_secret, area: people, severity: high, title: A person can read a production secret, why: "A secret read once can be used from anywhere until it is rotated: an API key, a database password or a partner's credential.", fix: "Let only the workload's own role read it; give people a break-glass path that alerts."}
  - {id: person_blind, area: detection, severity: high, title: A person can switch off the audit trail or threat detection, why: "An attacker's first step is to stop the recording. No organisation guardrail stops this person.", fix: "Add an SCP that denies StopLogging, DeleteTrail, PutEventSelectors and GuardDuty changes to everyone but the security team's role."}
  # ---- credentials
  - {id: user_keys_write, area: credentials, severity: critical, title: An IAM user's access key can change production, why: "A long-lived key sits in a file on a laptop or in a pipeline variable, works from anywhere and never expires. Binance's attacker found exactly this kind of deployment token on an engineer's laptop.", fix: "Delete the key. Use IAM Identity Center for people and an OIDC or service role for pipelines."}
  - {id: user_keys, area: credentials, severity: medium, title: An IAM user has an active access key, why: "A long-lived key on disk can be copied without anyone noticing, and works until someone deletes it.", fix: "Replace it with short-lived credentials and delete it."}
  - {id: user_no_mfa, area: credentials, severity: high, title: An IAM user signs in to the console without MFA, why: "A password alone is enough to sign in, from any machine.", fix: "Require MFA, or move the person to IAM Identity Center."}
  - {id: root_exposed, area: credentials, severity: critical, title: The root user has an access key or no MFA, why: "Root can do anything, and no permission set, boundary or SCP limits it.", fix: "Delete the root access key and turn on MFA; better still, centralise root access in the organisation."}
  - {id: long_session, area: credentials, severity: medium, title: People with write access keep their sign-in for hours, why: "A session token taken from a laptop works for its full length. Long sessions widen the window after a theft.", fix: "Set the permission set's session to one hour or less for anything that can change production."}
  # ---- pipelines
  - {id: pipeline_trust_open, area: pipelines, severity: critical, title: A pipeline role trusts too much, why: "The role accepts a sign-in from any repository or branch of the CI service, so anyone who can run a workflow there, or fork a repository, can act as the pipeline.", fix: "Add a subject condition naming the one repository and protected branch or environment."}
  - {id: outside_trust, area: pipelines, severity: high, title: Another company's account can become a role here, why: "The role trusts an account outside the organisation with no external ID, so anyone in that account with the right permissions can use it.", fix: "Add an sts:ExternalId condition, or remove the trust."}
  - {id: unsigned_code, area: pipelines, severity: medium, title: A payment function accepts unsigned code, why: "Without code signing, any code uploaded by anyone allowed to update the function runs, including code that never went through the pipeline.", fix: "Attach a code signing configuration set to Enforce, signed by the pipeline's profile."}
  - {id: mutable_images, area: pipelines, severity: medium, title: Container images can be replaced under the same tag, why: "With mutable tags, a new image pushed as the same tag is what the next deployment runs. Services that deploy by tag rather than digest cannot tell.", fix: "Make tags immutable and deploy by image digest."}
  # ---- exposure
  - {id: api_open, area: exposure, severity: high, title: An API answers anyone on the internet with no sign-in, why: "The API is reachable from any laptop and at least one method checks nothing about the caller.", fix: "Add an authoriser, IAM, mutual TLS or a private endpoint; restrict it to the networks that should call it."}
  - {id: fn_url_open, area: exposure, severity: high, title: A function URL needs no sign-in, why: "Anyone with the URL can call the function from anywhere.", fix: "Set the function URL to AWS_IAM, or remove it."}
  - {id: fn_public_policy, area: exposure, severity: high, title: A function's policy lets anyone call it, why: "The function's resource policy allows every principal with no condition.", fix: "Name the service or account that calls it, with a source ARN."}
  - {id: db_public, area: exposure, severity: high, title: A database has a public address, why: "The database can be reached from outside the network if its security group allows it, which makes a stolen password usable from a laptop anywhere.", fix: "Turn off public access and reach it through the private network."}
  # ---- detection
  - {id: trail_off, area: detection, severity: critical, title: No audit trail records this account, why: "Without CloudTrail nothing records who changed what, so nothing can alert and nothing can be investigated.", fix: "Turn on the organisation trail, multi-region, with management events."}
  - {id: data_events_off, area: detection, severity: high, title: Writes to payment data are not recorded, why: "CloudTrail records a file overwrite or a row write only when data events are on for that resource. Here a payment file or row can change with no record of who did it.", fix: "Turn on write data events for these buckets and tables in the organisation trail."}
  - {id: read_events_off, area: detection, severity: medium, title: Secret reads and signatures are not recorded, why: "Reading a secret and signing with a key are read events. With no trail keeping them, they leave no trace.", fix: "Keep read management events, at least for Secrets Manager and KMS."}
  - {id: guardduty_off, area: detection, severity: high, title: Threat detection is off where the assets are, why: "GuardDuty spots credentials used from unusual places, calls from known attacker addresses and logging being switched off.", fix: "Turn on GuardDuty in every region, from the organisation's delegated administrator."}
  - {id: guardduty_s3_off, area: detection, severity: medium, title: GuardDuty does not watch S3 data, why: "Without S3 protection, unusual reads and writes of payment files are not analysed.", fix: "Turn on S3 protection in GuardDuty."}
  - {id: role_assume_no_alert, area: detection, severity: high, title: Becoming a high-risk role raises no alert, why: "These roles can change money-moving resources. With laptops and pipelines assumed compromised, the moment someone takes a session on one is the moment to look, and nothing in this account fires on it.", fix: "Alert on AssumeRole, AssumeRoleWithSAML and AssumeRoleWithWebIdentity for these roles (an EventBridge rule on the role ARNs, or the SIEM), and require a source identity so each session names the person."}
  - {id: payment_file_no_alert, area: detection, severity: high, title: A change to a payment file raises no alert, why: "A payment file that is overwritten or replaced while it waits to be collected is the injection point. Nothing here alerts when one changes.", fix: "Turn on EventBridge notifications for the bucket and alert on Object Created and Object Deleted outside the producing role, or alert on its CloudTrail data events."}
  - {id: trail_no_validation, area: detection, severity: high, title: The audit trail can be altered without trace, why: "Log file validation is off, so a log file edited or deleted after delivery cannot be detected. An attacker who reaches the log bucket can rewrite history.", fix: "Turn on log file validation, and keep the log bucket in a separate account with Object Lock."}
  - {id: api_no_logs, area: detection, severity: medium, title: Calls to an API leave no record, why: "API calls are not in CloudTrail. Without access logs, a call from a compromised laptop leaves nothing to find.", fix: "Turn on access logging on every stage, to a log group the developers cannot change."}
  - {id: no_change_alert, area: detection, severity: medium, title: No alert in this account fires on a change made by a person, why: "Nothing here raises a signal when someone changes production by hand. An alert in a central security account would not show from here, so confirm it exists.", fix: "Alert on every write by a human principal in production, from EventBridge or the SIEM."}
  # ---- changes made by hand
  - {id: laptop_changes, area: changes, severity: high, title: People changed production from a laptop's command line, why: "These changes came from a person's own credentials through the CLI, an SDK or Terraform on their machine, not the pipeline. A stolen session looks exactly like this.", fix: "Find out why each was made by hand; move them into the pipeline and alert on the next one."}
  - {id: console_changes, area: changes, severity: medium, title: People changed production in the console, why: "Changes made by hand in the console skip review and are hard to tell from an attacker's.", fix: "Move routine changes into the pipeline; keep console write access for break-glass."}
  # ---- tamper evidence
  - {id: payment_no_versioning, area: integrity, severity: high, title: A payment bucket keeps no old versions, why: "A file that is overwritten or deleted is gone: there is nothing to compare the payment file with, and nothing to restore.", fix: "Turn on versioning, and MFA delete or Object Lock."}
  - {id: payment_no_lock, area: integrity, severity: medium, title: A payment bucket's files can be deleted before their time, why: "Without Object Lock, someone who can delete versions can remove the evidence of a change.", fix: "Turn on Object Lock in compliance mode for the files' retention period."}
  - {id: table_no_pitr, area: integrity, severity: medium, title: A payment table cannot be rolled back, why: "Without point-in-time recovery, rows changed or deleted by a compromised credential cannot be restored to a known moment.", fix: "Turn on point-in-time recovery, and back the table up to a vault in another account."}
  - {id: secret_no_rotation, area: integrity, severity: medium, title: A payment secret is never rotated, why: "A secret copied from a compromised laptop or pipeline works until it changes. Without rotation that is forever.", fix: "Turn on rotation, and alert on GetSecretValue by anything but the workload's role."}
  - {id: db_no_activity, area: integrity, severity: medium, title: A payment database records no activity outside itself, why: "A row inserted by someone with the admin password is recorded, if at all, only inside the database, where the same person can remove it.", fix: "Turn on Database Activity Streams, or the engine's audit log shipped to an account the DBAs cannot change."}

blind_spots:
  - {title: Grants inside the database, why: "Which database users can insert or change rows is held in the database itself, not in AWS."}
  - {title: The network path from a laptop, why: "Whether the VPN or office network reaches a private API or database is decided outside AWS, so a path that works only from inside the network is shown as such."}
  - {title: The laptops themselves, why: "Endpoint protection, who owns the toolchain folders and what is installed are not visible from AWS."}
  - {title: Payment file control totals, why: "Whether each payment file is reconciled to a total from a separate system cannot be seen in AWS settings. Test it as a scenario."}
  - {title: Kubernetes deployments, why: "Who can deploy into an EKS cluster is held in Kubernetes RBAC and access entries, read in the Outage Risk Report, not here."}
  - {title: Alerts in a central security account, why: "An alert rule in the SIEM or a security account is not visible from the payment account. Where this report finds no alert, confirm one exists centrally."}
  - {title: Roles switched into from another account, why: "A role trusted by another account in the organisation, such as a jump account, is counted as a person's path. Who in that account can reach it is decided there; check that account too."}
  - {title: Who is assigned each permission set, why: "IAM Identity Center assignments are held in the management account; this report names the permission set, not the people in it."}
