name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Tests
        run: pytest
      - name: Catalog doc is current
        run: python scripts/gen_catalog_doc.py --check

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e '.[dev]'
          playwright install --with-deps chromium
      - name: Render dashboard and PDF (fails on any browser console error)
        run: python scripts/screenshots.py
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            docs/images/*.png
            docs/sample-report.pdf
