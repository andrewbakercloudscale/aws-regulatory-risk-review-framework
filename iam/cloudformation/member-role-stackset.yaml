# Deploy with CloudFormation StackSets (service-managed) to every account in the OU you
# want to deep-scan. Creates a list-only role the exit-risk scanner assumes from the
# management account. It cannot read data, only count resources.
AWSTemplateFormatVersion: "2010-09-09"
Description: Read-only role for aws-regulatory-risk-review-framework deep scans
Parameters:
  ScannerAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
    Description: Account the scanner runs from (normally the management account)
  ScannerPrincipalArn:
    Type: String
    Default: ""
    Description: Optional - restrict to one IAM role/user ARN in the scanner account
Conditions:
  HasPrincipal: !Not [!Equals [!Ref ScannerPrincipalArn, ""]]
Resources:
  ExitRiskReadOnly:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ExitRiskReadOnly
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !If [HasPrincipal, !Ref ScannerPrincipalArn, !Sub "arn:${AWS::Partition}:iam::${ScannerAccountId}:root"]
            Action: sts:AssumeRole
            Condition:
              StringLike:
                sts:RoleSessionName: "exitrisk-*"
      Policies:
        - PolicyName: ExitRiskInventoryListOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeRegions
                  - lambda:ListFunctions
                  - dynamodb:ListTables
                  - states:ListStateMachines
                  - kinesis:ListStreams
                  - sqs:ListQueues
                  - sns:ListTopics
                  - events:ListRules
                  - apigateway:GET
                  - cognito-idp:ListUserPools
                  - glue:GetJobs
                  - redshift:DescribeClusters
                  - cloudformation:ListStacks
                  - eks:ListClusters
                  - ecs:ListClusters
                  - rds:DescribeDBInstances
                  - ec2:DescribeInstances
                  - s3:ListAllMyBuckets
                  - ecs:ListServices
                Resource: "*"
              # Dependency scan: counts the integrations between services; nothing is stored but counts.
              - Effect: Allow
                Action:
                  - lambda:ListEventSourceMappings
                  - events:ListTargetsByRule
                  - sns:ListSubscriptions
                  - states:DescribeStateMachine
                Resource: "*"
              # Cloud Assurance Framework checks: security and control settings, read-only. The AWS managed
              # policy SecurityAudit grants all of these (and more) if you prefer to attach that instead.
              - Effect: Allow
                Action:
                  - iam:GetAccountSummary
                  - iam:GenerateCredentialReport
                  - iam:GetCredentialReport
                  - iam:GetAccountAuthorizationDetails
                  - iam:GetAccountPasswordPolicy
                  - s3:GetAccountPublicAccessBlock
                  - s3:ListAllMyBuckets
                  - s3:GetBucketVersioning
                  - s3:GetBucketObjectLockConfiguration
                  - s3:GetReplicationConfiguration
                  - s3:GetBucketTagging
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketPolicyStatus
                  - s3:GetBucketPolicy
                  - s3:GetBucketOwnershipControls
                  - s3:GetEncryptionConfiguration
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetTrailStatus
                  - cloudtrail:GetEventSelectors
                  - cloudtrail:LookupEvents
                  - account:GetAlternateContact
                  - budgets:ViewBudget
                  - macie2:GetMacieSession
                  - cloudfront:ListDistributions
                  - trustedadvisor:ListRecommendations
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeNetworkAcls
                  - ec2:DescribeInstances
                  - ec2:DescribeImages
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeNatGateways
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpnConnections
                  - ec2:DescribeVpcs
                  - ec2:DescribeFlowLogs
                  - ec2:GetEbsEncryptionByDefault
                  - ec2:DescribeSnapshots
                  - ec2:DescribeVolumes
                  - ec2:DescribeRegions
                  - route53resolver:ListResolverQueryLogConfigAssociations
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeLoadBalancerAttributes
                  - wafv2:ListWebACLs
                  - wafv2:ListResourcesForWebACL
                  - apigateway:GET
                  - autoscaling:DescribeAutoScalingGroups
                  - rds:DescribeDBInstances
                  - rds:DescribeDBClusters
                  - dynamodb:ListTables
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:DescribeTable
                  - elasticache:DescribeReplicationGroups
                  - elasticache:DescribeCacheClusters
                  - es:ListDomainNames
                  - es:DescribeDomains
                  - redshift:DescribeClusters
                  - elasticfilesystem:DescribeFileSystems
                  - ecs:ListClusters
                  - ecs:ListServices
                  - ecs:DescribeServices
                  - directconnect:DescribeConnections
                  - acm:ListCertificates
                  - resiliencehub:ListApps
                  - eks:ListClusters
                  - eks:DescribeCluster
                  - lambda:ListFunctions
                  - backup:ListBackupPlans
                  - backup:GetBackupPlan
                  - backup:ListProtectedResources
                  - backup:ListRestoreJobs
                  - backup:ListBackupVaults
                  - fis:ListExperiments
                  - guardduty:ListDetectors
                  - guardduty:GetDetector
                  - guardduty:ListFindings
                  - securityhub:DescribeHub
                  - securityhub:GetEnabledStandards
                  - securityhub:GetFindings
                  - config:DescribeConfigurationRecorderStatus
                  - config:DescribeConfigurationRecorders
                  - config:DescribeConfigRules
                  - config:DescribeComplianceByConfigRule
                  - inspector2:BatchGetAccountStatus
                  - inspector2:ListFindings
                  - access-analyzer:ListAnalyzers
                  - access-analyzer:ListFindingsV2
                  - cloudformation:ListStacks
                  - ssm:DescribeInstanceInformation
                  - ssm:ListResourceComplianceSummaries
                  - kms:ListKeys
                  - kms:DescribeKey
                  - kms:GetKeyRotationStatus
                  - secretsmanager:ListSecrets
                  - ram:ListPrincipals
                  - events:ListRules
                  - logs:DescribeMetricFilters
                  - bedrock:GetModelInvocationLoggingConfiguration
                  - bedrock:ListGuardrails
                  - sagemaker:ListNotebookInstances
                  - sagemaker:DescribeNotebookInstance
                Resource: "*"
Outputs:
  RoleArn:
    Value: !GetAtt ExitRiskReadOnly.Arn
